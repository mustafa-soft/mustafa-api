<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mustafa Soft - لوحة تحكم</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui;background:#f0f2f5;margin:0;padding:0}
.header{background:#111;color:#fff;padding:18px 16px;display:flex;justify-content:space-between;align-items:center}
.header b{font-size:20px}
.header span{font-size:12px;opacity:.7}
.wrap{padding:14px;max-width:700px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
input,button{padding:12px;border-radius:10px;border:1px solid #ddd;width:100%;margin-top:8px;font-size:15px}
button{background:#111;color:#fff;border:0;cursor:pointer;font-weight:700}
.btn2{background:#fff;color:#111;border:1px solid #ddd}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}
.tabs button.active{background:#111;color:#fff}
.item{border-bottom:1px solid #eee;padding:10px 0;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.badge{background:#e8f5e9;color:#1a7f37;padding:3px 8px;border-radius:20px;font-size:11px}
.hidden{display:none}
.small{font-size:12px;color:#888}
</style>
</head>
<body>
<div class="header"><div><b>Mustafa Soft</b><br><span>لوحة تحكم - إدارة الطلبات</span></div><span id="dot">●</span></div>
<div class="wrap">

<div class="card" id="loginBox">
<h2 style="margin:0">دخول الأدمن 🔐</h2>
<p class="small">اكتب كلمة سر الأدمن عشان تفتح اللوحة</p>
<input type="password" id="adminPass" placeholder="كلمة سر الأدمن" inputmode="numeric">
<button onclick="login()">دخول للوحة</button>
<p id="loginMsg" style="color:red"></p>
<p class="small">كلمة السر: 123456</p>
</div>

<div id="panel" class="hidden">
<div class="card">
<b>حالة الـ API:</b> <span id="status">جاري...</span>
</div>

<div class="tabs">
<button id="tabOrders" class="active" onclick="showTab('orders')">📦 الطلبات</button>
<button id="tabCatalog" onclick="showTab('catalog')">🛒 الخدمات</button>
</div>

<div class="card" id="ordersCard">
<b>الطلبات الجديدة</b>
<p class="small">أي طلب جديد من الزبون حيظهر هنا، وكمان بتجيك رسالة في التيليجرام</p>
<div id="orders">جاري تحميل الطلبات...</div>
<button class="btn2" onclick="loadOrders()">🔄 تحديث الطلبات</button>
</div>

<div class="card hidden" id="catalogCard">
<b>الكتالوج - 658 خدمة</b>
<input type="text" id="search" placeholder="🔍 فتش على خدمة... مثال: AMT" oninput="filterCatalog()">
<div id="catalog">اضغط زر تحميل الخدمات تحت</div>
<button class="btn2" onclick="loadCatalog()">📥 تحميل الخدمات</button>
</div>

<button class="btn2" onclick="logout()">تسجيل خروج</button>
</div>
</div>

<script>
const API_URL = 'https://mustafa-api-mu.vercel.app';
const ADMIN_PASSWORD = '123456';
const API_SECRET = '';
let allItems = [];

function login(){
  const p = document.getElementById('adminPass').value.trim();
  if(p === ADMIN_PASSWORD){
    localStorage.setItem('mustafa_admin','1');
    showPanel();
  } else {
    document.getElementById('loginMsg').innerText = 'كلمة السر غلط - اكتب 123456 بالأرقام الإنجليزية';
  }
}
function logout(){ localStorage.removeItem('mustafa_admin'); location.reload(); }
function showPanel(){
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  loadStatus();
  loadOrders();
}
function showTab(t){
  document.getElementById('tabOrders').classList.toggle('active', t==='orders');
  document.getElementById('tabCatalog').classList.toggle('active', t==='catalog');
  document.getElementById('ordersCard').classList.toggle('hidden', t!=='orders');
  document.getElementById('catalogCard').classList.toggle('hidden', t!=='catalog');
  if(t==='catalog' && allItems.length===0) loadCatalog();
}
async function loadStatus(){
  try{
    const r = await fetch(API_URL + '/health');
    const d = await r.json();
    document.getElementById('status').innerHTML = 'متصل ✅ <span class="badge">شغال</span>';
    document.getElementById('dot').style.color = '#22c55e';
  }catch(e){ document.getElementById('status').innerText = 'API unavailable ❌'; }
}
async function loadOrders(){
  document.getElementById('orders').innerText = 'جاري...';
  try{
    const headers = {};
    if(API_SECRET) headers['x-admin-key'] = API_SECRET;
    const r = await fetch(API_URL + '/admin/status', {headers: headers});
    const d = await r.json();
    document.getElementById('orders').innerHTML = '<pre style="white-space:pre-wrap;font-size:12px">' + JSON.stringify(d, null, 2) + '</pre>';
  }catch(e){ document.getElementById('orders').innerText = 'ما قدرنا نجيب الطلبات: ' + e; }
}
async function loadCatalog(){
  document.getElementById('catalog').innerText = 'جاري تحميل الخدمات...';
  try{
    const r = await fetch(API_URL + '/catalog?limit=100');
    const d = await r.json();
    allItems = d.items || [];
    renderCatalog(allItems);
  }catch(e){ document.getElementById('catalog').innerText = 'ما قدرنا نجيب الكتالوج'; }
}
function renderCatalog(list){
  if(!list.length){ document.getElementById('catalog').innerText = 'ما في خدمات'; return; }
  let html = '<p class="small">عرض ' + list.length + ' خدمة</p>';
  list.slice(0,30).forEach(it=>{
    html += '<div class="item"><span>' + (it.name || it.title || JSON.stringify(it)) + '</span><span class="badge">متوفر</span></div>';
  });
  document.getElementById('catalog').innerHTML = html;
}
function filterCatalog(){
  const q = document.getElementById('search').value.toLowerCase();
  const f = allItems.filter(it => JSON.stringify(it).toLowerCase().includes(q));
  renderCatalog(f);
}
if(localStorage.getItem('mustafa_admin') === '1'){ showPanel(); }
</script>
</body>
</html>

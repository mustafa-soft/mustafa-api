.box{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}

<body>

<div class="box" id="loginBox">
<h3>دخول الأدمن</h3>
<p>اكتب كلمة سر الأدمن:</p>
<input type="password" id="adminPass" placeholder="كلمة سر الأدمن">
<button onclick="login()">دخول</button>
<p id="loginMsg" style="color:red"></p>
<p style="font-size:12px;color:#888">كلمة السر الحالية: <b>123456</b></p>
</div>

<div id="panel" class="hidden">
<div class="box"><b>حالة الـ API:</b> <span id="status">جاري...</span></div>
<div class="box"><b>الطلبات:</b><div id="orders">جاري تحميل الطلبات...</div></div>
<div class="box"><b>الكتالوج:</b><div id="catalog">جاري تحميل الخدمات...</div></div>
<button onclick="logout()">تسجيل خروج</button>
</div>

<script>
const API_URL = 'https://mustafa-api-mu.vercel.app';
const ADMIN_PASSWORD = '123456';

function login(){
  const p = document.getElementById('adminPass').value;
  if(p === ADMIN_PASSWORD){
    localStorage.setItem('mustafa_admin','1');
    localStorage.setItem('mustafa_admin_pass', p);
    showPanel();
  } else {
    document.getElementById('loginMsg').innerText = 'كلمة السر غلط';
  }
}
function logout(){
  localStorage.removeItem('mustafa_admin');
  localStorage.removeItem('mustafa_admin_pass');
  location.reload();
}
function showPanel(){
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  loadStatus();
  loadOrders();
  loadCatalog();
}

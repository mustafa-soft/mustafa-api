<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة تحكم Mustafa Soft</title>
</head>
<body>
<h1>لوحة تحكم Mustafa Soft</h1>
<p id="status">جاري الاتصال بالـ API...</p>
<div id="orders"></div>
<script>
const API_URL = 'https://mustafa-api-mu.vercel.app';
async function load() {
  try {
    const r = await fetch(API_URL + '/health');
    const d = await r.json();
    document.getElementById('status').innerText = 'متصل بالـ API ✅ : ' + JSON.stringify(d);
  } catch(e) {
    document.getElementById('status').innerText = 'API unavailable ❌ : ' + e;
  }
}
load();
</script>
</body>
</html>
